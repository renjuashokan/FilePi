name: Build Go Server with Blazor Frontend

on:
  push:
    branches: 
        - main_go
        - try/*
  pull_request:
    branches:
        - main_go
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            goarch: amd64
            goos: linux
          - arch: arm64
            goarch: arm64
            goos: linux
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.1'
        check-latest: true

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Set artifact name and development version
      id: set-artifact-props
      run: |
        # Get branch name
        if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
          BRANCH_NAME="${GITHUB_HEAD_REF}"
        else
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
        fi
        
        # Clean branch name for artifact naming
        CLEAN_NAME="$(echo "$BRANCH_NAME" | sed -E 's/^(b|feat\/|try\/)//g' | sed -e 's/ /_/g' | sed -e 's/\//_/g')"
        echo "Clean branch name is: $CLEAN_NAME"

        RUN_NUMBER=${{ github.run_number }}
        VERSION="${CLEAN_NAME}_${RUN_NUMBER}"
        
        # Create a Debian-compatible version (must start with a digit)
        DEB_VERSION="1.0.0+${CLEAN_NAME}.${RUN_NUMBER}"
        
        echo "build-name=$VERSION" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "deb-version=$DEB_VERSION" >> $GITHUB_OUTPUT
        
        echo "Using artifact name: filepi-${VERSION}"
        echo "Using version: $VERSION"
        echo "Using Debian version: $DEB_VERSION"

    - name: Get dependencies
      run: go mod download

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Install LibMan CLI (for client-side libraries)
      run: dotnet tool install -g Microsoft.Web.LibraryManager.Cli

    - name: Build Blazor WebAssembly Frontend
      run: |
        echo "Building Blazor WebAssembly frontend..."
        cd FilePiWeb
        
        # Add LibMan package if not already present
        if ! dotnet list package | grep -q "Microsoft.Web.LibraryManager.Build"; then
          dotnet add package Microsoft.Web.LibraryManager.Build
        fi
        
        # Restore client-side libraries
        if [ -f "libman.json" ]; then
          libman restore
        fi
        
        # Build and publish Blazor
        dotnet publish -c Release -o ../temp-publish
        cd ..
        
        # Copy published files to webdeploy directory
        mkdir -p webdeploy
        cp -r temp-publish/wwwroot/* webdeploy/
        rm -rf temp-publish/
        
        echo "Blazor frontend built successfully"
        echo "WebDeploy contents:"
        ls -la webdeploy/

    - name: Build Go binary
      run: |
        echo "Building Go backend..."
        GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-X main.Version=${{ steps.set-artifact-props.outputs.version }}" -o filepi
        
        echo "Go binary built successfully"
        ls -la filepi

    - name: Verify webdeploy directory
      run: |
        if [ ! -d "webdeploy" ] || [ ! -f "webdeploy/index.html" ]; then
          echo "ERROR: webdeploy directory is missing or incomplete"
          echo "webdeploy contents:"
          ls -la webdeploy/ || echo "webdeploy directory does not exist"
          exit 1
        fi
        
        echo "✅ webdeploy directory verified"
        echo "Contents:"
        find webdeploy -type f | head -10

    - name: Create binary tarball
      run: |
        # Create tarball with both Go binary and webdeploy
        BINARY_NAME="filepi-${{ steps.set-artifact-props.outputs.build-name }}-linux-${{ matrix.arch }}"
        
        # Create a temporary directory structure
        mkdir -p ${BINARY_NAME}
        cp filepi ${BINARY_NAME}/
        cp -r webdeploy ${BINARY_NAME}/
        
        # Create tarball
        tar -czvf ${BINARY_NAME}.tar.gz ${BINARY_NAME}
        
        echo "Tarball created: ${BINARY_NAME}.tar.gz"
        tar -tzvf ${BINARY_NAME}.tar.gz | head -10

    - name: Build Debian package
      run: |
        echo "Building Debian package..."
        chmod +x build-deb.sh
        ./build-deb.sh "${{ steps.set-artifact-props.outputs.deb-version }}" "${{ matrix.arch }}"
        
        # Rename the deb file to include architecture
        mv outputs/filepi_*.deb filepi_${{ steps.set-artifact-props.outputs.build-name }}_${{ matrix.arch }}.deb
        
        echo "Debian package created:"
        ls -la filepi_${{ steps.set-artifact-props.outputs.build-name }}_${{ matrix.arch }}.deb

    - name: Upload binary tarball
      uses: actions/upload-artifact@v4
      with:
        name: filepi-${{ steps.set-artifact-props.outputs.build-name }}-linux-${{ matrix.arch }}
        path: filepi-${{ steps.set-artifact-props.outputs.build-name }}-linux-${{ matrix.arch }}.tar.gz

    - name: Upload Debian package
      uses: actions/upload-artifact@v4
      with:
        name: filepi_debian_${{ steps.set-artifact-props.outputs.build-name }}_${{ matrix.arch }}
        path: filepi_${{ steps.set-artifact-props.outputs.build-name }}_${{ matrix.arch }}.deb

  summary:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-artifacts
        merge-multiple: true

    - name: List artifacts
      run: |
        echo "## 🎉 Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "The following artifacts have been created:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Go Binaries (with Blazor WebAssembly UI):" >> $GITHUB_STEP_SUMMARY
        for file in all-artifacts/*.tar.gz; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            size=$(ls -lh "$file" | awk '{print $5}')
            echo "- $filename ($size)" >> $GITHUB_STEP_SUMMARY
          fi
        done
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Debian Packages:" >> $GITHUB_STEP_SUMMARY
        for file in all-artifacts/*.deb; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            size=$(ls -lh "$file" | awk '{print $5}')
            echo "- $filename ($size)" >> $GITHUB_STEP_SUMMARY
          fi
        done